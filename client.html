<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050A13">
  <title>Sentinelle Pro — Espace client</title>
  <link rel="icon" href="./assets/favicon.png">
  <link rel="stylesheet" href="./client-style.css?v=581">
</head>
<body>
  <main id="client-app" class="client-shell">
    <section class="client-login-card">
      <img src="./assets/logo.png" alt="Sentinelle Pro" class="client-logo">
      <h1>Espace client</h1>
      <p>Consultez les mains courantes et rapports PDF de vos sites.</p>
      <form id="client-login-form">
        <label>Adresse e-mail<input type="email" name="email" autocomplete="username" required></label>
        <label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">Se connecter</button>
      </form>
      <div id="client-message" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script type="module" src="./client-app.js?v=581"></script>
</body>
</html>
