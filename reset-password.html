<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06101c">
  <meta name="robots" content="noindex,nofollow">
  <title>Sentinelle Pro — Nouveau mot de passe</title>
  <link rel="icon" href="./assets/favicon.png">
  <link rel="stylesheet" href="./client-style.css?v=593">

  <style>
    /* V5.10.6 — Correctif strictement visuel de la page de récupération */
    body.reset-page{
      min-height:100vh;
      min-height:100dvh;
      margin:0;
      display:grid;
      place-items:center;
      padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
      overflow-x:hidden;
      background:linear-gradient(180deg,#eef4f8 0%,#e7eff5 100%);
    }
    .reset-page .ambient{pointer-events:none;position:fixed;z-index:0;border-radius:999px;filter:blur(12px)}
    .reset-page .ambient-a{width:360px;height:360px;top:-190px;right:-150px;background:radial-gradient(circle,rgba(100,208,255,.22),rgba(100,208,255,0) 70%)}
    .reset-page .ambient-b{width:320px;height:320px;bottom:-190px;left:-150px;background:radial-gradient(circle,rgba(16,42,67,.10),rgba(16,42,67,0) 70%)}
    .reset-page .client-shell{
      position:relative;z-index:1;
      width:min(520px,100%);
      margin:0 auto;
      padding:0;
    }
    .reset-page .auth-wrap{width:100%;display:block}
    .reset-page .auth-card{
      width:100%;
      padding:clamp(24px,5vw,38px);
      border:1px solid rgba(191,210,223,.92);
      border-radius:28px;
      background:rgba(255,255,255,.94);
      box-shadow:0 24px 70px rgba(15,42,67,.14);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .reset-page .brand-lockup{
      display:flex;align-items:center;gap:14px;
      margin:0 0 24px;
      color:var(--azzera-deep);
      font-size:10px;font-weight:850;letter-spacing:.15em;
    }
    .reset-page .client-logo{
      display:block;
      width:56px!important;
      height:56px!important;
      max-width:56px!important;
      max-height:56px!important;
      object-fit:contain;
      flex:0 0 56px;
    }
    .reset-page .auth-card h1{
      margin:0 0 10px;
      color:var(--navy);
      font-size:clamp(30px,7vw,42px);
      line-height:1.06;
      letter-spacing:-.04em;
    }
    .reset-page .lead{max-width:none;font-size:14px;line-height:1.6}
    .reset-page .reset-box{margin-top:26px;gap:16px}
    .reset-page .reset-box button{width:100%;min-height:48px}
    .reset-page #reset-actions{width:100%}
    .reset-page #reset-actions button{flex:1 1 180px}
    .reset-page .security-note{line-height:1.5}
    @media(max-width:560px){
      body.reset-page{place-items:center;padding:max(14px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
      .reset-page .auth-card{padding:24px 20px;border-radius:22px}
      .reset-page .brand-lockup{margin-bottom:20px}
      .reset-page .client-logo{width:46px!important;height:46px!important;max-width:46px!important;max-height:46px!important;flex-basis:46px}
      .reset-page .auth-card h1{font-size:30px}
      .reset-page .lead{font-size:13px}
      .reset-page input{min-height:48px}
      .reset-page .security-note{margin-top:22px;padding-top:16px;font-size:10px}
    }
    @media(max-height:650px) and (min-width:561px){
      body.reset-page{place-items:start center}
      .reset-page .client-shell{margin-top:24px;margin-bottom:24px}
    }
  </style>
</head>
<body class="reset-page">
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <main class="client-shell">
    <section class="auth-wrap">
      <div class="auth-card">
        <div class="brand-lockup"><img src="./assets/logo.png" alt="Sentinelle Pro" class="client-logo"><span>RÉCUPÉRATION</span></div>
        <h1>Nouveau mot de passe</h1>
        <p class="lead" id="reset-lead">Vérification sécurisée du lien en cours…</p>
        <form id="reset-password-form" class="reset-box" hidden>
          <label>Nouveau mot de passe<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
          <label>Confirmer<input type="password" name="confirm" minlength="8" autocomplete="new-password" required></label>
          <button type="submit">Enregistrer le nouveau mot de passe</button>
        </form>
        <div id="client-message" role="status" aria-live="polite"></div>
        <div id="reset-actions" style="display:none;gap:10px;flex-wrap:wrap;margin-top:18px">
          <button class="secondary" type="button" id="reset-return-primary">Retour à la connexion</button>
          <button class="ghost" type="button" id="reset-return-other">Autre portail</button>
        </div>
        <div class="security-note"><span>●</span> Le lien de récupération ne vous connecte à aucun espace après la modification.</div>
      </div>
    </section>
  </main>
  <script type="module" src="./reset-password.js?v=593"></script>
</body>
</html>
